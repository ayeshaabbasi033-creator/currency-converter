[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "currency-converter-cli"
version = "0.1.0"
description = "Lightweight CLI currency converter with SQLite rate caching and conversion history"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
currency = "currency_converter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
